<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TabShare Viewer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        #screen {
            display: block;
            max-width: 100vw;
            max-height: 100vh;
            cursor: default;
            outline: none;
        }
        #status {
            position: fixed;
            top: 12px;
            left: 12px;
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 13px;
            padding: 6px 12px;
            border-radius: 6px;
            z-index: 1000;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }
        .status-connecting { background: rgba(255,170,0,0.15); color: #ffa500; border: 1px solid rgba(255,170,0,0.3); }
        .status-connected  { background: rgba(0,200,80,0.15); color: #0c6; border: 1px solid rgba(0,200,80,0.3); }
        .status-error      { background: rgba(255,60,60,0.15); color: #f44; border: 1px solid rgba(255,60,60,0.3); }

        /* Navigation loading overlay */
        #nav-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 10, 15, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 900;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        #nav-overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: rgba(120, 160, 255, 0.8);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .nav-text {
            margin-top: 16px;
            color: rgba(255,255,255,0.5);
            font-size: 14px;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div id="status" class="status-connecting">Connecting…</div>
    <div id="nav-overlay">
        <div class="spinner"></div>
        <div class="nav-text">Loading…</div>
    </div>
    <video id="screen" autoplay playsinline muted tabindex="0"></video>

    <script>
    (() => {
        const statusEl = document.getElementById('status');
        const video = document.getElementById('screen');
        const navOverlay = document.getElementById('nav-overlay');
        const tabId = window.location.pathname.split('/').pop();

        let ws, pc;
        let statusFadeTimer = null;

        function setStatus(text, type) {
            statusEl.textContent = text;
            statusEl.className = `status-${type}`;
            statusEl.style.opacity = '1';
            clearTimeout(statusFadeTimer);
            if (type === 'connected') {
                statusFadeTimer = setTimeout(() => { statusEl.style.opacity = '0'; }, 3000);
            }
        }

        function showNavOverlay() {
            navOverlay.classList.add('visible');
        }

        function hideNavOverlay() {
            navOverlay.classList.remove('visible');
        }

        function negotiate() {
            if (pc) {
                try { pc.close(); } catch(e) {}
            }

            pc = new RTCPeerConnection({
                iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
            });
            pc.addTransceiver('video', { direction: 'recvonly' });

            pc.ontrack = (event) => {
                if (video.srcObject !== event.streams[0]) {
                    video.srcObject = event.streams[0];
                }
                video.play().catch(() => {});
                video.focus();
            };

            pc.onicecandidate = (event) => {
                if (event.candidate && ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: 'webrtc', signal: { ice: event.candidate } }));
                }
            };

            pc.oniceconnectionstatechange = () => {
                const state = pc.iceConnectionState;
                console.log('ICE:', state);
                if (state === 'connected' || state === 'completed') {
                    setStatus('Connected', 'connected');
                    hideNavOverlay();
                } else if (state === 'disconnected' || state === 'failed') {
                    setStatus('Waiting…', 'connecting');
                }
            };

            setStatus('Signaling…', 'connecting');
            pc.createOffer().then(offer => {
                return pc.setLocalDescription(offer);
            }).then(() => {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: 'webrtc', signal: { offer: pc.localDescription } }));
                }
            }).catch(e => console.error('Offer error:', e));
        }

        function connect() {
            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${location.host}/ws/tab/${tabId}`);

            ws.onopen = () => {
                setStatus('Waiting for stream…', 'connecting');
            };

            ws.onclose = () => {
                setStatus('Disconnected', 'error');
                if (pc) { try { pc.close(); } catch(e) {} pc = null; }
                setTimeout(connect, 2000);
            };

            ws.onerror = () => {};

            ws.onmessage = async (event) => {
                const msg = JSON.parse(event.data);
                if (msg.type !== 'webrtc') return;
                const signal = msg.signal;
                try {
                    if (signal.navigating) {
                        // Page is navigating — show loading overlay
                        console.log('Page navigating…');
                        showNavOverlay();
                        setStatus('Page loading…', 'connecting');
                    } else if (signal.ready) {
                        // Stream ready — (re)negotiate
                        console.log('Stream ready — negotiating');
                        negotiate();
                    } else if (signal.answer) {
                        if (pc && pc.signalingState !== 'closed') {
                            await pc.setRemoteDescription(new RTCSessionDescription(signal.answer));
                        }
                    } else if (signal.ice) {
                        if (pc && pc.signalingState !== 'closed') {
                            await pc.addIceCandidate(new RTCIceCandidate(signal.ice));
                        }
                    }
                } catch(e) {
                    console.error('Signal error:', e);
                }
            };
        }

        // ─── Input Mapping ───

        function getScale() {
            const rect = video.getBoundingClientRect();
            const vw = video.videoWidth || rect.width;
            const vh = video.videoHeight || rect.height;
            return { sx: vw / rect.width, sy: vh / rect.height, ox: rect.left, oy: rect.top };
        }

        function mapCoords(e) {
            const { sx, sy, ox, oy } = getScale();
            return { x: (e.clientX - ox) * sx, y: (e.clientY - oy) * sy };
        }

        function buttonName(b) {
            return b === 0 ? 'left' : b === 1 ? 'middle' : b === 2 ? 'right' : 'none';
        }

        function sendInput(data) {
            if (ws?.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify(data));
            }
        }

        video.addEventListener('mousemove', (e) => {
            e.preventDefault();
            const { x, y } = mapCoords(e);
            sendInput({ type: 'mouse', eventType: 'mouseMoved', x, y, button: 'none' });
        });

        video.addEventListener('mousedown', (e) => {
            e.preventDefault();
            video.focus();
            const { x, y } = mapCoords(e);
            sendInput({ type: 'mouse', eventType: 'mousePressed', x, y, button: buttonName(e.button) });
        });

        video.addEventListener('mouseup', (e) => {
            e.preventDefault();
            const { x, y } = mapCoords(e);
            sendInput({ type: 'mouse', eventType: 'mouseReleased', x, y, button: buttonName(e.button) });
        });

        video.addEventListener('contextmenu', e => e.preventDefault());

        video.addEventListener('wheel', (e) => {
            e.preventDefault();
            const { x, y } = mapCoords(e);
            sendInput({ type: 'scroll', x, y, deltaX: e.deltaX, deltaY: e.deltaY });
        }, { passive: false });

        video.addEventListener('keydown', (e) => {
            e.preventDefault();
            e.stopPropagation();
            sendInput({ type: 'keyboard', eventType: 'keyDown', key: e.key, code: e.code });
        });

        video.addEventListener('keyup', (e) => {
            e.preventDefault();
            e.stopPropagation();
            sendInput({ type: 'keyboard', eventType: 'keyUp', key: e.key, code: e.code });
        });

        document.body.addEventListener('click', () => video.focus());

        connect();
    })();
    </script>
</body>
</html>
