<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TabShare WebRTC Viewer</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        video {
            display: block;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            max-width: 100vw;
            max-height: 100vh;
        }
        #status {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #0f0;
            font-family: monospace;
            background: rgba(0,0,0,0.7);
            padding: 5px;
            border-radius: 4px;
            pointer-events: none;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div id="status">Connecting...</div>
    <video id="screen" autoplay playsinline muted></video>

    <script>
        const statusEl = document.getElementById('status');
        const video = document.getElementById('screen');

        const parts = window.location.pathname.split('/');
        const tabId = parts[parts.length - 1];

        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}/ws/tab/${tabId}`;
        const ws = new WebSocket(wsUrl);

        const pc = new RTCPeerConnection();

        // Ensure we offer to receive video stream
        pc.addTransceiver('video', { direction: 'recvonly' });

        pc.ontrack = (event) => {
            console.log("Track received!", event);
            if (video.srcObject !== event.streams[0]) {
                video.srcObject = event.streams[0];
                console.log("srcObject set, stream tracks:", event.streams[0].getTracks().map(t => t.kind + ":" + t.readyState));
            }
            video.play().then(() => {
                console.log("Video playing");
            }).catch(e => {
                console.error("Video play failed:", e);
            });
        };

        ws.onopen = async () => {
            statusEl.innerText = "Waiting for capture stream...";
            statusEl.style.color = "#ff0";
        };

        ws.onclose = () => {
            statusEl.innerText = "Disconnected";
            statusEl.style.color = "#f00";
            pc.close();
        };

        ws.onmessage = async (event) => {
            const msg = JSON.parse(event.data);
            if (msg.type === 'webrtc') {
                const signal = msg.signal;
                try {
                    if (signal.ready) {
                        statusEl.innerText = "Signaling...";
                        // Create offer ONLY when we receive the stream ready ping
                        const offer = await pc.createOffer();
                        await pc.setLocalDescription(offer);
                        ws.send(JSON.stringify({
                            type: 'webrtc',
                            signal: { offer: pc.localDescription }
                        }));
                    } else if (signal.answer) {
                        await pc.setRemoteDescription(new RTCSessionDescription(signal.answer));
                    } else if (signal.ice) {
                        await pc.addIceCandidate(new RTCIceCandidate(signal.ice));
                    }
                } catch(e) {
                    console.error("WebRTC Error:", e);
                }
            }
        };

        pc.onicecandidate = (event) => {
            if (event.candidate) {
                console.log("Viewer ICE candidate:", event.candidate.candidate);
                ws.send(JSON.stringify({
                    type: 'webrtc',
                    signal: { ice: event.candidate }
                }));
            } else {
                console.log("Viewer ICE gathering complete");
            }
        };

        pc.oniceconnectionstatechange = () => {
            console.log("ICE Connection State:", pc.iceConnectionState);
            if (pc.iceConnectionState === 'connected' || pc.iceConnectionState === 'completed') {
                statusEl.innerText = "Connected (WebRTC)";
                statusEl.style.color = "#0f0";
            } else if (pc.iceConnectionState === 'disconnected' || pc.iceConnectionState === 'failed') {
                statusEl.innerText = "WebRTC Disconnected";
                statusEl.style.color = "#f00";
            }
        };

        // Inputs Mapping
        function getScale() {
            const rect = video.getBoundingClientRect();
            // Video raw resolution
            const vw = video.videoWidth || rect.width;
            const vh = video.videoHeight || rect.height;
            return {
                scaleX: vw / rect.width,
                scaleY: vh / rect.height,
                offsetX: rect.left,
                offsetY: rect.top
            };
        }

        function sendMouseEvent(e, eventType) {
            e.preventDefault();
            const { scaleX, scaleY, offsetX, offsetY } = getScale();
            const x = (e.clientX - offsetX) * scaleX;
            const y = (e.clientY - offsetY) * scaleY;
            
            let btn = "none";
            if (e.button === 0) btn = "left";
            else if (e.button === 1) btn = "middle";
            else if (e.button === 2) btn = "right";

            ws.send(JSON.stringify({
                type: 'mouse',
                eventType: eventType,
                x: x,
                y: y,
                button: btn
            }));
        }

        video.addEventListener('mousemove', (e) => sendMouseEvent(e, 'mouseMoved'));
        video.addEventListener('mousedown', (e) => sendMouseEvent(e, 'mousePressed'));
        video.addEventListener('mouseup', (e) => {
            // Give some time before focusing to ensure video keeps playing though playsinline usually works flawlessly
            video.focus();
            sendMouseEvent(e, 'mouseReleased');
        });
        
        video.addEventListener('contextmenu', e => e.preventDefault());

        video.addEventListener('wheel', (e) => {
            e.preventDefault();
            const { scaleX, scaleY, offsetX, offsetY } = getScale();
            const x = (e.clientX - offsetX) * scaleX;
            const y = (e.clientY - offsetY) * scaleY;
            
            ws.send(JSON.stringify({
                type: 'scroll',
                x: x,
                y: y,
                deltaX: e.deltaX,
                deltaY: e.deltaY
            }));
        }, { passive: false });

        window.addEventListener('keydown', (e) => {
            ws.send(JSON.stringify({
                type: 'keyboard',
                eventType: 'keyDown',
                key: e.key,
                code: e.code,
                keyCode: e.keyCode
            }));
        });

        window.addEventListener('keyup', (e) => {
            ws.send(JSON.stringify({
                type: 'keyboard',
                eventType: 'keyUp',
                key: e.key,
                code: e.code,
                keyCode: e.keyCode
            }));
        });
    </script>
</body>
</html>
