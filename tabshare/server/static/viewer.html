<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TabShare Viewer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        #screen {
            display: block;
            max-width: 100vw;
            max-height: 100vh;
            cursor: default;
            outline: none;
        }
        #status {
            position: fixed;
            top: 12px;
            left: 12px;
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 13px;
            padding: 6px 12px;
            border-radius: 6px;
            z-index: 1000;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }
        .status-connecting { background: rgba(255,170,0,0.15); color: #ffa500; border: 1px solid rgba(255,170,0,0.3); }
        .status-connected  { background: rgba(0,200,80,0.15); color: #0c6; border: 1px solid rgba(0,200,80,0.3); }
        .status-error      { background: rgba(255,60,60,0.15); color: #f44; border: 1px solid rgba(255,60,60,0.3); }

        /* Navigation loading overlay */
        #nav-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 10, 15, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 900;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        #nav-overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: rgba(120, 160, 255, 0.8);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .nav-text {
            margin-top: 16px;
            color: rgba(255,255,255,0.5);
            font-size: 14px;
            letter-spacing: 0.5px;
        }
    </style>
    <!-- Native WebRTC, no SDK needed -->
</head>
<body>
    <div id="status" class="status-connecting">Connecting…</div>
    <div id="nav-overlay">
        <div class="spinner"></div>
        <div class="nav-text">Loading…</div>
    </div>
    <video id="screen" autoplay playsinline muted tabindex="-1"></video>

    <!-- Hidden input element for IME support -->
    <textarea id="ime-trap" style="position: absolute; left: 0; top: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; z-index: -1;" autofocus></textarea>

    <script>
    (() => {
        const statusEl = document.getElementById('status');
        const video = document.getElementById('screen');
        const navOverlay = document.getElementById('nav-overlay');
        const imeTrap = document.getElementById('ime-trap');
        const tabId = window.location.pathname.split('/').pop();

        let ws, pc;
        let statusFadeTimer = null;

        function setStatus(text, type) {
            statusEl.textContent = text;
            statusEl.className = `status-${type}`;
            statusEl.style.opacity = '1';
            clearTimeout(statusFadeTimer);
            if (type === 'connected') {
                statusFadeTimer = setTimeout(() => { statusEl.style.opacity = '0'; }, 3000);
            }
        }

        function showNavOverlay() {
            navOverlay.classList.add('visible');
        }

        function hideNavOverlay() {
            navOverlay.classList.remove('visible');
        }

        async function connectSFU() {
            if (pc) { try { pc.close(); } catch(e) {} pc = null; }
            try {
                setStatus('Connecting to stream…', 'connecting');

                pc = new RTCPeerConnection({
                    iceServers: [],
                    iceTransportPolicy: 'all'
                });

                // We only receive video, add a transceiver
                pc.addTransceiver('video', { direction: 'recvonly' });

                pc.ontrack = (ev) => {
                    console.log('[viewer] got track:', ev.track.kind);
                    if (ev.track.kind === 'video') {
                        video.srcObject = ev.streams[0] || new MediaStream([ev.track]);
                        setStatus('Connected', 'connected');
                        hideNavOverlay();
                        imeTrap.focus({ preventScroll: true });
                        // Re-register frame watch for new stream
                        if (typeof startFrameWatch === 'function') startFrameWatch();
                    }
                };

                pc.oniceconnectionstatechange = () => {
                    console.log('[viewer] ICE state:', pc.iceConnectionState);
                    if (pc.iceConnectionState === 'failed' || pc.iceConnectionState === 'disconnected') {
                        setStatus('Disconnected', 'error');
                        showNavOverlay();
                        setTimeout(connectSFU, 2000);
                    }
                };

                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);

                const res = await fetch(`/api/sfu/offer?room=${tabId}&role=sub`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sdp: pc.localDescription.sdp })
                });

                if (!res.ok) {
                    const text = await res.text();
                    throw new Error(`SFU error: ${res.status} ${text}`);
                }

                const answer = await res.json();
                await pc.setRemoteDescription(new RTCSessionDescription({
                    type: answer.type,
                    sdp: answer.sdp
                }));

                console.log('[viewer] SDP answer set, waiting for ICE+media');
            } catch (e) {
                console.error('SFU connect error:', e);
                setStatus('Waiting for publisher…', 'connecting');
                setTimeout(connectSFU, 3000);
            }
        }

        function connectWS() {
            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${location.host}/ws/tab/${tabId}`);

            ws.onopen = () => {
                setStatus('Waiting for stream…', 'connecting');
            };

            ws.onmessage = (ev) => {
                try {
                    const msg = JSON.parse(ev.data);
                    if (msg.type === 'nav_start') {
                        showNavOverlay();
                        setStatus('Page loading…', 'connecting');
                    } else if (msg.type === 'nav_done') {
                        // Publisher reconnected, track is seamless — no action needed
                    }
                } catch(e) {}
            };

            ws.onclose = () => {
                console.log('WebSocket closed');
                setTimeout(connectWS, 2000);
            };

            ws.onerror = () => {};

        }

        // ─── Input Mapping ───

        function getScale() {
            const rect = video.getBoundingClientRect();
            const vw = video.videoWidth || rect.width;
            const vh = video.videoHeight || rect.height;
            return { sx: vw / rect.width, sy: vh / rect.height, ox: rect.left, oy: rect.top };
        }

        function mapCoords(e) {
            const { sx, sy, ox, oy } = getScale();
            return { x: (e.clientX - ox) * sx, y: (e.clientY - oy) * sy };
        }

        function buttonName(b) {
            return b === 0 ? 'left' : b === 1 ? 'middle' : b === 2 ? 'right' : 'none';
        }

        function sendInput(data) {
            if (ws?.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify(data));
            }
        }

        // ─── Mouse Events (on Video) ───

        video.addEventListener('mousemove', (e) => {
            e.preventDefault();
            const { x, y } = mapCoords(e);
            sendInput({ type: 'mouse', eventType: 'mouseMoved', x, y, button: 'none' });
        });

        video.addEventListener('mousedown', (e) => {
            e.preventDefault();
            imeTrap.focus({ preventScroll: true }); // Keep IME trap focused
            const { x, y } = mapCoords(e);
            sendInput({ type: 'mouse', eventType: 'mousePressed', x, y, button: buttonName(e.button) });
        });

        video.addEventListener('mouseup', (e) => {
            e.preventDefault();
            const { x, y } = mapCoords(e);
            sendInput({ type: 'mouse', eventType: 'mouseReleased', x, y, button: buttonName(e.button) });
        });

        video.addEventListener('contextmenu', e => e.preventDefault());

        video.addEventListener('wheel', (e) => {
            e.preventDefault();
            const { x, y } = mapCoords(e);
            sendInput({ type: 'scroll', x, y, deltaX: e.deltaX, deltaY: e.deltaY });
        }, { passive: false });

        // ─── Keyboard & IME Events (on Hidden Textarea) ───
        
        let isComposing = false;

        imeTrap.addEventListener('compositionstart', () => {
            console.log("IME: compositionstart");
            isComposing = true;
        });

        imeTrap.addEventListener('compositionend', (e) => {
            console.log("IME: compositionend", e.data);
            isComposing = false;
            if (e.data) {
                sendInput({ type: 'insertText', text: e.data });
            }
            // 延迟清空，防止立刻触发的 input 事件读取到残留或干扰浏览器状态
            setTimeout(() => { imeTrap.value = ''; }, 0);
        });

        imeTrap.addEventListener('input', (e) => {
            console.log("IME: input event", { isComposing, val: imeTrap.value, inputType: e.inputType });
            // 如果正在拼写拼音，绝对不能清空 value，否则打断输入法！
            if (isComposing) return;
            
            // 处理非输入法状态下的纯粘贴
            if (e.inputType === 'insertFromPaste') {
                sendInput({ type: 'insertText', text: imeTrap.value });
            }
            
            // 正常按键已经在 keydown 里发过了，这里直接清空垃圾即可
            setTimeout(() => { imeTrap.value = ''; }, 0);
        });

        imeTrap.addEventListener('keydown', (e) => {
            console.log("IME: keydown", { key: e.key, code: e.code, isComposing });
            // Do not send bare keydowns while composing or if it's the IME modifier key 229
            if (isComposing || e.keyCode === 229 || e.key === 'Process' || e.key === 'Unidentified') {
                return;
            }
            
            // Standard control and character keys go here
            sendInput({ type: 'keyboard', eventType: 'keyDown', key: e.key, code: e.code });
            
            // Prevent browser back navigation for backspace
            if (e.key === 'Backspace' || e.key === 'Tab') {
                e.preventDefault();
            }
        });

        imeTrap.addEventListener('keyup', (e) => {
            if (isComposing || e.keyCode === 229 || e.key === 'Process' || e.key === 'Unidentified') {
                return;
            }
            sendInput({ type: 'keyboard', eventType: 'keyUp', key: e.key, code: e.code });
        });

        // Ensure the trap stays focused
        document.body.addEventListener('click', () => {
            imeTrap.focus({ preventScroll: true });
        });

        // Initialize connections
        connectWS();
        connectSFU();

        // Frame watch: only hides overlay when video frames arrive
        function startFrameWatch() {
            if (!('requestVideoFrameCallback' in HTMLVideoElement.prototype)) return;
            function onFrame() {
                hideNavOverlay();
                setStatus('Connected', 'connected');
                video.requestVideoFrameCallback(onFrame);
            }
            video.requestVideoFrameCallback(onFrame);
        }
        video.addEventListener('playing', startFrameWatch, { once: true });
    })();
    </script>
</body>
</html>
