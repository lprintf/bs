version: '3.8'

services:
  sfu:
    build:
      context: ./sfu
      pull: false
    restart: unless-stopped
    ports:
      - "59055:59055/udp"
      - "59055:59055/tcp"
      - "8085:8085" # TabShare HTTP (exposed via shared network)
    environment:
      - NAT_IP=${HOST_IP}
      - UDP_PORT=59055
      - HTTP_PORT=8088

  tabshare:
    build:
      context: ./tabshare
      pull: false
    restart: unless-stopped
    network_mode: "service:sfu"
    depends_on:
      - sfu
    shm_size: '2gb'
    volumes:
      - ./tabshare:/app
      - ./tabshare/data:/data
      - ./tabshare/data/opt/chromium:/data/opt/chromium:ro # 暂时不用
    environment:
      - SFU_INTERNAL_URL=http://127.0.0.1:8088

volumes:
  tabshare-data:
