version: '3.8'

services:
  sfu:
    build:
      context: ./sfu
      pull: false
    restart: unless-stopped
    ports:
      - "59055:59055/udp"
      - "59055:59055/tcp"
      - "8085:8085" # TabShare HTTP (exposed via shared network)
    volumes:
      - ./tabshare/data/recordings:/data/recordings
    environment:
      - NAT_IP=${HOST_IP}
      - UDP_PORT=59055
      - HTTP_PORT=8088
      - RECORDING_DIR=/data/recordings

  tabshare:
    build:
      context: ./tabshare
      pull: false
    restart: unless-stopped
    network_mode: "service:sfu"
    depends_on:
      - sfu
    shm_size: '2gb'
    volumes:
      - ./tabshare:/app
      - ./tabshare/data:/data
    environment:
      - SFU_INTERNAL_URL=http://127.0.0.1:8088
      - REBROWSER_PATCHES_SOURCE_URL=app.js
      - REBROWSER_PATCHES_UTILITY_WORLD_NAME=util

volumes:
  tabshare-data:
