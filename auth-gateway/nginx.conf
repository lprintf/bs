worker_processes 2;
worker_rlimit_nofile 65535;
env AUTH_ISSUER;
env AUTH_AUDIENCE;
env JWKS_URL;
env JWKS_PATH;
env JWKS_REFRESH_INTERVAL_SECONDS;
env JWKS_FORCE_REFRESH_COOLDOWN_SECONDS;
env SESSION_INTROSPECT_URL;
env SESSION_RESOLVE_URL;

events {
    worker_connections 8192;
    multi_accept on;
}

http {
    default_type application/json;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30s;
    keepalive_requests 10000;
    client_header_timeout 10s;
    client_body_timeout 10s;
    reset_timedout_connection on;
    resolver 127.0.0.11 ipv6=off valid=10s;
    lua_shared_dict jwks_cache 1m;
    lua_package_path "/etc/nginx/lua/?.lua;/usr/share/lua/common/?.lua;/usr/share/lua/common/?/init.lua;;";

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" "";
    }

    init_worker_by_lua_block {
        local jwks = require "jwks"
        jwks.init_worker()
    }

    log_format main escape=json
      '{"time":"$time_iso8601","request_id":"$request_id","remote_addr":"$remote_addr",'
      '"method":"$request_method","uri":"$request_uri","status":$status,'
      '"request_time":$request_time,"upstream_time":"$upstream_response_time",'
      '"user_id":"$auth_user"}';

    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    upstream auth_service {
        server auth-service:8000;
        keepalive 128;
        keepalive_requests 10000;
        keepalive_timeout 30s;
    }

    upstream tabshare_service {
        server sfu:8085;
        keepalive 256;
        keepalive_requests 10000;
        keepalive_timeout 30s;
    }

    server {
        listen 8080 default_server;
        set $auth_user "";
        set $session_verified "";
        set $session_verified_at "";

        location = /healthz {
            return 200 '{"status":"ok"}';
        }

        location = /login {
            proxy_pass http://auth_service/login;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header X-User-Id "";
        }

        location = /login/page {
            proxy_pass http://auth_service/login/page$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header X-User-Id "";
        }

        location = /logout {
            proxy_pass http://auth_service/logout$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header X-User-Id "";
        }

        location = /.well-known/jwks.json {
            proxy_pass http://auth_service/.well-known/jwks.json;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header X-User-Id "";
        }

        location ^~ /static/ {
            proxy_pass http://tabshare_service;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-User-Id "";
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header X-Require-Session-Check "";
            proxy_set_header X-Auth-Session-Verified "";
            proxy_set_header X-Auth-Session-Verified-At "";
            proxy_set_header X-Internal-Auth-Subject "";
            proxy_set_header X-Internal-Auth-Session "";
        }

        location = /favicon.ico {
            proxy_pass http://tabshare_service;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-User-Id "";
            proxy_set_header X-Request-Id $request_id;
        }

        location /api/ {
            access_by_lua_block {
                require("auth").require_json()
            }

            proxy_pass http://tabshare_service;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-User-Id $auth_user;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header X-Require-Session-Check "";
            proxy_set_header X-Auth-Session-Verified $session_verified;
            proxy_set_header X-Auth-Session-Verified-At $session_verified_at;
            proxy_set_header X-Internal-Auth-Subject "";
            proxy_set_header X-Internal-Auth-Session "";
        }

        location /ws/ {
            access_by_lua_block {
                require("auth").require_json()
            }

            proxy_pass http://tabshare_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-User-Id $auth_user;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header X-Require-Session-Check "";
            proxy_set_header X-Auth-Session-Verified $session_verified;
            proxy_set_header X-Auth-Session-Verified-At $session_verified_at;
            proxy_set_header X-Internal-Auth-Subject "";
            proxy_set_header X-Internal-Auth-Session "";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location / {
            access_by_lua_block {
                require("auth").require_page()
            }

            proxy_pass http://tabshare_service;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-User-Id $auth_user;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header X-Require-Session-Check "";
            proxy_set_header X-Auth-Session-Verified $session_verified;
            proxy_set_header X-Auth-Session-Verified-At $session_verified_at;
            proxy_set_header X-Internal-Auth-Subject "";
            proxy_set_header X-Internal-Auth-Session "";
        }
    }
}
